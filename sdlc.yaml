version: v1
name: roar-dashboard
traceability:
  mode: warn
release_naming:
  format: semver-v-strict
  mapping: R1
stages:
  planning:
    require_milestone: true
    require_issues_assigned: true
  development:
    branch: main
    deploy_target: dev
    deploy_workflow: .github/workflows/deploy-development.yml
    required_checks:
      - Lint
      - Unit tests
      - Build
      - End-to-end tests (chrome, 1)
      - End-to-end tests (chrome, 2)
      - End-to-end tests (chrome, 3)
      - End-to-end tests (chrome, 4)
      - End-to-end tests (edge, 1)
      - End-to-end tests (edge, 2)
      - End-to-end tests (edge, 3)
      - End-to-end tests (edge, 4)
      - Component tests (chrome)
      - Component tests (edge)
    required_reviewers:
      min_approvals: 1
  testing:
    branch_pattern: main
    deploy_target: staging
    deploy_workflow: .github/workflows/deploy-staging.yml
    required_checks:
      - Lint
      - Unit tests
      - Build
      - End-to-end tests (chrome, 1)
      - End-to-end tests (chrome, 2)
      - End-to-end tests (chrome, 3)
      - End-to-end tests (chrome, 4)
      - End-to-end tests (edge, 1)
      - End-to-end tests (edge, 2)
      - End-to-end tests (edge, 3)
      - End-to-end tests (edge, 4)
      - Component tests (chrome)
      - Component tests (edge)
    required_reviewers:
      min_approvals: 1
  evidencing:
    required_reviewers:
      min_approvals: 1
  deployment:
    target: production
    deploy_workflow: .github/workflows/deploy-production.yml
    deploy_on_tag: true
    required_checks: []
    promotion: manual
    requires_evidence_approval: true
