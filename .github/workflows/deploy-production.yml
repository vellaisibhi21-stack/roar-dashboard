name: Deploy to Production

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}

permissions:
  contents: read
  id-token: write

jobs:
  # ––––––––––––––––––––––––––––––––––––––––––––––– #
  # Product owner review
  # ––––––––––––––––––––––––––––––––––––––––––––––– #
  product-owner-review:
    name: Request product owner review
    runs-on: ubuntu-latest
    environment: product-owner-review
    timeout-minutes: 15
    steps:
      - name: Fork test stub
        run: 'echo "LaneSync onboarding test on a fork: the upstream secrets are
          unavailable, so this step is a stub."'

  # ––––––––––––––––––––––––––––––––––––––––––––––– #
  # Deploy app
  # ––––––––––––––––––––––––––––––––––––––––––––––– #
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    needs: product-owner-review
    timeout-minutes: 15
    steps:
      - name: Fork test stub
        run: 'echo "LaneSync onboarding test on a fork: the upstream secrets are
          unavailable, so this step is a stub."'
