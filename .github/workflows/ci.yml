name: Continuous Integration

on:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  id-token: write

jobs:
  # ––––––––––––––––––––––––––––––––––––––––––––––– #
  # Lint & Format
  # ––––––––––––––––––––––––––––––––––––––––––––––– #
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fork test stub
        run: 'echo "LaneSync onboarding test on a fork: the upstream secrets are
          unavailable, so this step is a stub."'

  # ––––––––––––––––––––––––––––––––––––––––––––––– #
  # Test
  # ––––––––––––––––––––––––––––––––––––––––––––––– #
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fork test stub
        run: 'echo "LaneSync onboarding test on a fork: the upstream secrets are
          unavailable, so this step is a stub."'

  # ––––––––––––––––––––––––––––––––––––––––––––––– #
  # Build the application
  # ––––––––––––––––––––––––––––––––––––––––––––––– #
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fork test stub
        run: 'echo "LaneSync onboarding test on a fork: the upstream secrets are
          unavailable, so this step is a stub."'

  # ––––––––––––––––––––––––––––––––––––––––––––––– #
  # End-to-end tests
  # ––––––––––––––––––––––––––––––––––––––––––––––– #
  e2e-tests:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome, edge ]
        containers: [ 1, 2, 3, 4 ]

    steps:
      - name: Fork test stub
        run: 'echo "LaneSync onboarding test on a fork: the upstream secrets are
          unavailable, so this step is a stub."'

  # ––––––––––––––––––––––––––––––––––––––––––––––– #
  # Component Tests
  # ––––––––––––––––––––––––––––––––––––––––––––––– #
  component-tests:
    name: Component tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome, edge ]

    steps:
      - name: Fork test stub
        run: 'echo "LaneSync onboarding test on a fork: the upstream secrets are
          unavailable, so this step is a stub."'

  # ––––––––––––––––––––––––––––––––––––––––––––––– #
  # Deploy to Preview Environment
  # ––––––––––––––––––––––––––––––––––––––––––––––– #
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [ lint, test, build ]
    timeout-minutes: 8

    steps:
      - name: Fork test stub
        run: 'echo "LaneSync onboarding test on a fork: the upstream secrets are
          unavailable, so this step is a stub."'
